  --ok:#5fd08e; --warn:#ff7b6b; --hc:#ffd27a; --hc-bg:#3a2e10; color-scheme:dark;}}

  <h1>Badminton Tornooi <small id="sub"></small></h1>

    <button data-tab="spelers">Spelers</button>

<script>
const KEY='bt.tornooi.v1', DBKEY='bt.spelers.v1', TABKEY='bt.tab.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const sum=a=>a.reduce((t,x)=>t+x,0);
const mean=a=>a.length?sum(a)/a.length:0;
const fmt=x=>Number.isInteger(x)?String(x):x.toFixed(1);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const DEF={mode:'team',courts:4,target:21,ext:false,extFinal:true,extCap:30,minSingles:0,plannedRounds:8,
  hc:true,hcFactor:1,hcMax:'',damesCorr:[2,2,2,2,2,2,2,2,2,2,2,2],teamA:'Team Blauw',teamB:'Team Oranje'};
function fresh(){return {settings:{...DEF,damesCorr:[...DEF.damesCorr]},players:[],rounds:[],teamsMade:false,nextId:1}}
let S=lsGet(KEY)||fresh(); S.settings={...DEF,...S.settings,hcFactor:1};
let DB=lsGet(DBKEY)||{};
let tab=lsGet(TABKEY)||'spelers';
let pending=null; // bevestiging in de pagina zelf
function save(){lsSet(KEY,S)}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

/* ---------- Sterkte & klassementsvoordeel ---------- */
const P=id=>S.players.find(p=>p.id===id);
const nm=id=>P(id)?.name??'?';
function autoCorr(p){return p.gender==='D'?(+S.settings.damesCorr[p.rank-1]||0):0}
function corrOf(p){return (p.corr!==''&&p.corr!=null&&!isNaN(+p.corr))?+p.corr:autoCorr(p)}
function level(p){return p.rank+corrOf(p)} // lager = sterker
function handicap(lvA,lvB){
  const s=S.settings; if(!s.hc) return {a:0,b:0};
  const sa=sum(lvA),sb=sum(lvB);
  let d=Math.round(Math.abs(sa-sb)*(+s.hcFactor||1));
  if(s.hcMax!==''&&!isNaN(+s.hcMax)) d=Math.min(d,+s.hcMax);
  d=Math.min(d,s.target-1);
  return sa>sb?{a:d,b:0}:{a:0,b:sa<sb?d:0};
}
const scored=m=>m.sa!==''&&m.sb!==''&&m.sa!=null&&m.sb!=null;
function scoreState(m,final){
  if(!scored(m)) return 'open';
  const a=+m.sa,b=+m.sb,t=S.settings.target,hi=Math.max(a,b),lo=Math.min(a,b);
  const ext=final?S.settings.extFinal:S.settings.ext;
  if(!ext) return hi===t&&lo<t?'ok':'check';
  const cap=Math.max(+S.settings.extCap||t,t);
  if(hi===t&&lo<=t-2) return 'ok';
  if(hi>t&&hi<=cap&&hi-lo===2) return 'ok';
  if(hi===cap&&lo===cap-1) return 'ok';
  return 'check';
}

/* ---------- Historiek per speler ---------- */
const started=R=>R.matches.some(scored);
// incl bepaalt welke rondes meetellen; standaard enkel rondes waarin al gespeeld is
function stats(upto=S.rounds.length,incl=started){
  const st={};
  S.players.forEach(p=>st[p.id]={played:0,singles:0,byes:0,realByes:0,lastBye:-9,lastSingle:-9,bal:0,partners:{},opps:{},pts:0,scored:0});
  for(let r=0;r<upto;r++){const R=S.rounds[r];if(!R||!incl(R,r))continue;
    S.players.forEach(p=>{if(p.joined>r)st[p.id].byes++});
    R.byes.forEach(id=>{const s=st[id];if(!s)return;s.byes++;s.realByes++;s.lastBye=r});
    R.matches.forEach(m=>{
      const sa=sum(m.lvA),sb=sum(m.lvB),done=scored(m);
      [[m.a,sb-sa,m.sa,m.b],[m.b,sa-sb,m.sb,m.a]].forEach(([ids,adv,score,opp])=>{
        ids.forEach((id,i)=>{const s=st[id];if(!s)return;
          s.played++;s.bal+=adv;
          if(ids.length===2){const q=ids[1-i];s.partners[q]=(s.partners[q]||0)+1}
          else{s.singles++;s.lastSingle=r}
          opp.forEach(o=>s.opps[o]=(s.opps[o]||0)+1);
          if(done){s.pts+=+score;s.scored++}
        });
      });
    });
  }
  return st;
}

/* ---------- Indeling (aantal enkels/dubbels/uitzitters) ---------- */
function planIndiv(n,courts,minS){
  minS=Math.max(0,Math.min(minS,courts,Math.floor(n/2)));let best={s:0,d:0,play:0};
  for(let s=minS;s<=Math.min(courts,Math.floor(n/2));s++)for(let d=0;s+d<=courts&&2*s+4*d<=n;d++){
    const play=2*s+4*d;if(play>best.play||(play===best.play&&s<best.s))best={s,d,play}}
  return best;
}
function planTeam(nA,nB,courts,minS){
  const kmax=Math.min(nA,nB);minS=Math.max(0,Math.min(minS,courts,kmax));let best={s:0,d:0,k:0};
  for(let s=minS;s<=Math.min(courts,kmax);s++)for(let d=0;s+d<=courts&&s+2*d<=kmax;d++){
    const k=s+2*d;if(k>best.k||(k===best.k&&s<best.s))best={s,d,k}}
  return best;
}
const activeP=()=>S.players.filter(p=>p.active);
function currentPlan(minS){
  const act=activeP(),c=+S.settings.courts||1;
  if(S.settings.mode==='team'){
    const A=act.filter(p=>p.team==='A'),B=act.filter(p=>p.team==='B'),f=planTeam(A.length,B.length,c,minS);
    return {...f,byes:A.length+B.length-2*f.k,A,B};
  }
  const f=planIndiv(act.length,c,minS);return {...f,byes:act.length-f.play,all:act};
}

/* ---------- Planner ----------
   Alle ongespeelde rondes worden samen gepland (simulated annealing), zodat de app niet
   ronde per ronde vastloopt. Wat telt (van zwaar naar licht):
   - nooit een identieke wedstrijd (zelfde dubbel tegen zelfde dubbel, zelfde enkel)
   - individueel: opnieuw dezelfde partner pas als je met iedereen even vaak stond,
     3e keer tegen dezelfde pas als je iedereen al 2 keer tegen had
     teammodus: herhalingen mogen, maar worden zo goed mogelijk gespreid
   - enkels eerlijk verdeeld, niet twee keer na elkaar
   - matchbalans: som van (niveau tegenstanders − niveau eigen kant) gaat per speler naar 0,
     ook tussentijds, zodat vroeger stoppen ook eerlijk is */
const W={ident:1e6,match:1,bal:1,single:80,singleRow:40,
  team:{partner:300,opp3:150,oppSpread:3},indiv:{partner:3000,opp3:3000,oppSpread:5}};
function forEachMatch(R,single,double){
  const f=R.f,g=R.groups;
  if(g.length===2){const [A,B]=g;
    for(let i=0;i<f.s;i++)single(A[i],B[i]);
    for(let j=0;j<f.d;j++){const b=f.s+2*j;double(A[b],A[b+1],B[b],B[b+1])}}
  else{const p=g[0];
    for(let i=0;i<f.s;i++)single(p[2*i],p[2*i+1]);
    for(let j=0;j<f.d;j++){const b=2*f.s+4*j;double(p[b],p[b+1],p[b+2],p[b+3])}}
}
function makeEvaluator(H){
  const N=H.N,lv=H.lv,w=H.team?W.team:W.indiv;
  const pC=new Int16Array(N*N),oC=new Int16Array(N*N),sC=new Int16Array(N),sR=new Int16Array(N),bal=new Float64Array(N);
  const keys=[];
  const pk=(x,y)=>x<y?x*64+y:y*64+x;
  return function(plan){
    pC.set(H.pC);oC.set(H.oC);sC.set(H.sC);sR.set(H.sR);bal.set(H.bal);keys.length=0;
    let c=0;
    const part=(x,y)=>{const n=pC[x*N+y];c+=w.partner*n;pC[x*N+y]++;pC[y*N+x]++};
    const opp=(x,y)=>{const n=oC[x*N+y];c+=w.oppSpread*n+(n>=2?w.opp3*(2*n-3):0);oC[x*N+y]++;oC[y*N+x]++};
    for(let r=0;r<plan.length;r++){
      forEachMatch(plan[r],(a,b)=>{
        const d=lv[b]-lv[a];c+=W.match*d*d;bal[a]+=d;bal[b]-=d;opp(a,b);
        for(const x of [a,b]){const n=sC[x];c+=W.single*(2*n+1);if(sR[x]===r-1)c+=W.singleRow;sC[x]++;sR[x]=r}
        keys.push(16777216+pk(a,b));
      },(a1,a2,b1,b2)=>{
        const d=lv[b1]+lv[b2]-lv[a1]-lv[a2];c+=W.match*d*d;bal[a1]+=d;bal[a2]+=d;bal[b1]-=d;bal[b2]-=d;
        part(a1,a2);part(b1,b2);opp(a1,b1);opp(a1,b2);opp(a2,b1);opp(a2,b2);
        const k1=pk(a1,a2),k2=pk(b1,b2);keys.push(k1<k2?k1*4096+k2:k2*4096+k1);
      });
      let b2=0;for(let i=0;i<N;i++)b2+=bal[i]*bal[i];c+=W.bal*b2/plan.length;
    }
    keys.sort((x,y)=>x-y);
    for(let i=0;i<keys.length;i++)if(H.keys.has(keys[i])||(i&&keys[i]===keys[i-1]))c+=W.ident;
    return c;
  };
}
function anneal(plan,evalf,ms){
  const clone=p=>p.map(R=>({...R,groups:R.groups.map(g=>g.slice())}));
  const mov=[];plan.forEach((R,ri)=>R.groups.forEach((g,gi)=>{if(g.length>1)mov.push([ri,gi])}));
  let cur=evalf(plan),best=cur,bestPlan=clone(plan);
  if(!mov.length)return {plan,cost:cur};
  const T0=120,T1=0.2,t0=performance.now();let T=T0,it=0;
  for(;;){
    if((it&127)===0){const el=performance.now()-t0;if(el>ms)break;T=T0*Math.pow(T1/T0,el/ms)}
    it++;
    const [ri,gi]=mov[Math.floor(Math.random()*mov.length)],g=plan[ri].groups[gi];
    const i=Math.floor(Math.random()*g.length),j=Math.floor(Math.random()*g.length);if(i===j)continue;
    [g[i],g[j]]=[g[j],g[i]];
    const c=evalf(plan);
    if(c<=cur||Math.random()<Math.exp((cur-c)/T)){cur=c;if(c<best-1e-9){best=c;bestPlan=clone(plan)}}
    else [g[i],g[j]]=[g[j],g[i]];
  }
  return {plan:bestPlan,cost:best,it};
}
// plant de rondes [from, to) opnieuw; rondes ervoor blijven zoals ze zijn
function planRounds(from,to,ms=2500){
  const s=S.settings,team=s.mode==='team',act=activeP();
  const oldMinS=S.rounds.slice(from).map(R=>R.minS);
  S.rounds.length=from;
  if(to<=from||act.length<2){computeConflicts();return}
  const ids=act.map(p=>p.id),ix={};ids.forEach((id,i)=>ix[id]=i);const N=ids.length;
  const st=stats(from,()=>true);
  const H={N,team,lv:ids.map(id=>level(P(id))),pC:new Int16Array(N*N),oC:new Int16Array(N*N),
    sC:new Int16Array(N),sR:new Int16Array(N).fill(-9),bal:new Float64Array(N),keys:new Set()};
  ids.forEach((id,i)=>{const x=st[id];H.sC[i]=x.singles;H.sR[i]=x.lastSingle===from-1?-1:-9;H.bal[i]=x.bal;
    for(const q in x.partners)if(q in ix)H.pC[i*N+ix[q]]=x.partners[q];
    for(const q in x.opps)if(q in ix)H.oC[i*N+ix[q]]=x.opps[q]});
  const pk=(x,y)=>x<y?x*64+y:y*64+x;
  S.rounds.slice(0,from).forEach(R=>R.matches.forEach(m=>{
    if(![...m.a,...m.b].every(id=>id in ix))return;
    const a=m.a.map(id=>ix[id]),b=m.b.map(id=>ix[id]);
    if(a.length===1)H.keys.add(16777216+pk(a[0],b[0]));
    else{const k1=pk(a[0],a[1]),k2=pk(b[0],b[1]);H.keys.add(k1<k2?k1*4096+k2:k2*4096+k1)}}));
  // uitzitters: wie het minst heeft uitgezeten (en niet net uitzat) zit eerst uit
  const byes={},lastBye={};ids.forEach(id=>{byes[id]=st[id].byes;lastBye[id]=st[id].lastBye});
  const pick=(list,n,r)=>n<=0?[]:shuffle(list.slice()).sort((x,y)=>(byes[x.id]-byes[y.id])||((lastBye[x.id]===r-1)-(lastBye[y.id]===r-1))).slice(0,n);
  const plan=[];
  for(let r=from;r<to;r++){
    const minS=oldMinS[r-from]??s.minSingles,f=currentPlan(minS);let by,groups;
    if(team){const bA=pick(f.A,f.A.length-f.k,r),bB=pick(f.B,f.B.length-f.k,r);by=[...bA,...bB];
      groups=[f.A.filter(p=>!bA.includes(p)).map(p=>ix[p.id]),f.B.filter(p=>!bB.includes(p)).map(p=>ix[p.id])]}
    else{by=pick(f.all,f.byes,r);groups=[f.all.filter(p=>!by.includes(p)).map(p=>ix[p.id])]}
    by.forEach(p=>{byes[p.id]++;lastBye[p.id]=r});
    plan.push({f,groups:groups.map(g=>shuffle(g)),byes:by.map(p=>p.id),minS});
  }
  const res=anneal(plan,makeEvaluator(H),ms),avg=mean(H.lv);
  res.plan.forEach(R=>{
    const M=[];
    forEachMatch(R,(a,b)=>M.push({a:[ids[a]],b:[ids[b]]}),(a1,a2,b1,b2)=>M.push({a:[ids[a1],ids[a2]],b:[ids[b1],ids[b2]]}));
    M.sort((x,y)=>y.a.length-x.a.length); // dubbels eerst op de terreinen
    S.rounds.push({avg,final:false,minS:R.minS,byes:R.byes,
      matches:M.map((m,i)=>({...m,court:i+1,lvA:m.a.map(id=>H.lv[ix[id]]),lvB:m.b.map(id=>H.lv[ix[id]]),sa:'',sb:''}))});
  });
  S.dirty=false;
  computeConflicts();
  return res;
}
// eerste ronde die nog vrij herpland mag worden: na de laatste ronde met een score
function firstFree(){let k=0;S.rounds.forEach((R,i)=>{if(started(R)||R.final)k=i+1});return k}
const plainRounds=()=>S.rounds.filter(R=>!R.final).length;

/* ---------- Controle achteraf: welke regels werden (noodgedwongen) niet gehaald ---------- */
function computeConflicts(){
  const team=S.settings.mode==='team',pc={},oc={},seen=new Set();
  const k=(a,b)=>a<b?a+'-'+b:b+'-'+a,g=(o,a,b)=>o[k(a,b)]||0;
  const sig=m=>m.a.length===1?'s'+k(m.a[0],m.b[0]):[k(m.a[0],m.a[1]),k(m.b[0],m.b[1])].sort().join('|');
  S.rounds.forEach(R=>{
    R.issues=[];
    const present=[...R.byes,...R.matches.flatMap(m=>[...m.a,...m.b])];
    const minOver=(x,o,filt)=>{const L=present.filter(q=>q!==x&&filt(q)).map(q=>g(o,x,q));return L.length?Math.min(...L):0};
    const same=x=>q=>!team||P(q)?.team===P(x)?.team,other=x=>q=>!team||P(q)?.team!==P(x)?.team;
    if(!R.final)R.matches.forEach(m=>{
      const sg=sig(m),names=ids=>ids.map(nm).join(' + ');
      if(seen.has(sg))R.issues.push(`${names(m.a)} tegen ${names(m.b)} is een identieke wedstrijd`);
      if(team)return;
      [m.a,m.b].forEach(ids=>{if(ids.length<2)return;const [x,y]=ids,n=g(pc,x,y);
        if(n>minOver(x,pc,same(x))||n>minOver(y,pc,same(y)))R.issues.push(`${nm(x)} en ${nm(y)} staan voor de ${n+1}e keer samen`)});
      m.a.forEach(x=>m.b.forEach(y=>{const n=g(oc,x,y)+1;
        if(n>Math.max(2,minOver(x,oc,other(x))+1)||n>Math.max(2,minOver(y,oc,other(y))+1))R.issues.push(`${nm(x)} speelt voor de ${n}e keer tegen ${nm(y)}`)}));
    });
    R.matches.forEach(m=>{seen.add(sig(m));
      [m.a,m.b].forEach(ids=>{if(ids.length===2)pc[k(ids[0],ids[1])]=g(pc,ids[0],ids[1])+1});
      m.a.forEach(x=>m.b.forEach(y=>oc[k(x,y)]=g(oc,x,y)+1))});
  });
}
function standings(){
  const st=stats();
  return S.players.map(p=>{const s=st[p.id],avg=s.scored?s.pts/s.scored:0;
    return {p,s,avg,corr:s.pts+s.realByes*avg}}).sort((x,y)=>(y.corr-x.corr)||(y.avg-x.avg));
}
function generateFinal(){
  S.rounds.length=firstFree();
  const act=new Set(activeP().map(p=>p.id));
  const order=standings().filter(x=>act.has(x.p.id)).map(x=>x.p);
  const lv={};order.forEach(p=>lv[p.id]=level(p));
  const M=[],byes=[];
  for(let i=0;i<order.length;i+=4){
    const g=order.slice(i,i+4).map(p=>p.id);
    if(g.length===4)M.push({a:[g[0],g[3]],b:[g[1],g[2]]});
    else if(g.length>=2){M.push({a:[g[0]],b:[g[1]]});if(g[2])byes.push(g[2])}
    else byes.push(...g);
  }
  const c=+S.settings.courts||1;
  S.rounds.push({avg:mean(order.map(level)),final:true,byes,issues:[],
    matches:M.map((m,i)=>({...m,court:i<c?i+1:'wacht ('+(i+1)+')',group:i,lvA:m.a.map(id=>lv[id]),lvB:m.b.map(id=>lv[id]),sa:'',sb:''}))});
}

/* ---------- Teams ---------- */
function makeTeams(){
  const act=activeP(),n=act.length,nA=Math.ceil(n/2);const c=[];
  for(let t=0;t<5000;t++){const sh=shuffle(act.slice()),A=sh.slice(0,nA),B=sh.slice(nA);
    const lA=A.map(level),lB=B.map(level);
    const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
    const cost=Math.abs(mean(lA)-mean(lB))*nA+0.8*Math.abs(A.filter(p=>p.gender==='D').length-B.filter(p=>p.gender==='D').length)+0.3*Math.abs(sd(lA)-sd(lB));
    c.push({cost,A,B})}
  c.sort((x,y)=>x.cost-y.cost);
  const pick=c[Math.floor(Math.random()*Math.min(12,c.length))];
  pick.A.forEach(p=>p.team='A');pick.B.forEach(p=>p.team='B');S.teamsMade=true;
}
function autoTeam(p){
  const act=activeP().filter(x=>x!==p&&x.team);
  const A=act.filter(x=>x.team==='A'),B=act.filter(x=>x.team==='B');
  if(A.length!==B.length)return A.length<B.length?'A':'B';
  // gelijk aantal: kies het team waar het gemiddelde niveau daarna het dichtst bij het andere ligt
  const gap=(X,Y)=>Math.abs(mean([...X,p].map(level))-mean(Y.map(level)));
  return gap(A,B)<=gap(B,A)?'A':'B';
}
const teamName=t=>t==='A'?S.settings.teamA:S.settings.teamB;
function teamsReady(){const a=activeP();return S.teamsMade&&a.some(p=>p.team==='A')&&a.some(p=>p.team==='B')}

    h+=`<section class="scoreboard"><div class="sb A"><div class="lbl">${esc(S.settings.teamA)}</div><div class="big">${a}</div></div>
      <div class="sb B"><div class="lbl">${esc(S.settings.teamB)}</div><div class="big">${b}</div></div></section>`}
  const cls=x=>x>0.5?'pos-bal':x<-0.5?'neg-bal':'';
  const sg=x=>(x>0?'+':'')+fmt(Math.round(x*10)/10);
  h+=`<section class="card"><h2>Individueel klassement</h2><div class="tablewrap"><table>
    <thead><tr><th>#</th><th>Speler</th><th>Punten</th><th>Wed.</th><th>Gem.</th><th>Uitgez.</th><th>Totaal*</th><th>Enkels</th><th>Matchbal.</th></tr></thead><tbody>
    ${rows.map((x,i)=>`<tr${x.p.active?'':' class="muted"'}><td class="pos">${i+1}</td><td>${team&&x.p.team?`<span class="tbtn ${x.p.team==='A'?'tA':'tB'}" style="padding:1px 6px;margin-right:6px">${x.p.team}</span>`:''}${esc(x.p.name)} <span class="muted">(${fmt(level(x.p))})</span></td>
      <td>${x.s.pts}</td><td>${x.s.scored}</td><td>${x.avg.toFixed(1)}</td><td>${x.s.realByes}</td><td><b>${Math.round(x.corr)}</b></td><td>${x.s.singles}</td>
      <td class="${cls(x.s.bal)}">${sg(x.s.bal)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="hint">* Totaal = punten + (keren uitgezeten × eigen gemiddelde), zodat uitzitten geen nadeel geeft. Het klassement volgt dit totaal.<br>
    Matchbalans: som van (niveau tegenstanders − niveau eigen kant). Positief = makkelijkere matchen gehad, negatief = zwaardere.
    De planning stuurt dit voor iedereen richting 0. Alleen rondes met scores tellen mee.</p></section>`;
  return h;
}
function vInst(){
  const s=S.settings,locked=S.rounds.length>0;
  const num=(k,l,h,attr='')=>`<label class="field">${l}<input type="number" data-set="${k}" value="${esc(s[k])}" ${attr}>${h?`<span class="h">${h}</span>`:''}</label>`;
  const chk=(k,l,h)=>`<label class="field"><span class="row"><input type="checkbox" data-set="${k}" ${s[k]?'checked':''}> ${l}</span>${h?`<span class="h">${h}</span>`:''}</label>`;
  return `<section class="card"><h2>Tornooi</h2><div class="grid2">
    <label class="field">Vorm<select data-set="mode" ${locked?'disabled':''}><option value="team" ${s.mode==='team'?'selected':''}>Teamtornooi (2 teams)</option><option value="indiv" ${s.mode==='indiv'?'selected':''}>Individueel tornooi</option></select>
      <span class="h">${locked?'Vast zodra er een ronde gespeeld is.':'Kies voor je de eerste ronde maakt.'}</span></label>
    ${num('courts','Aantal terreinen','','min="1" max="20"')}
    <label class="field">Naam team 1<input data-set="teamA" value="${esc(s.teamA)}"></label>
    <label class="field">Naam team 2<input data-set="teamB" value="${esc(s.teamB)}"></label>
  </div></section>
  <section class="card"><h2>Wedstrijden</h2><div class="grid2">
    ${num('target','Spelen tot','Bijv. 21, 15 of 11.','min="1" max="99"')}
    ${chk('ext','Verlengingen in gewone rondes','2 punten verschil, tot het maximum hieronder.')}
    ${chk('extFinal','Verlengingen in de finaleronde','')}
    ${num('extCap','Maximum bij verlenging','Bijv. 30 bij spelen tot 21.','min="1" max="99"')}
  </div></section>
  <section class="card"><h2>Klassementsvoordeel</h2><div class="grid2">
    ${chk('hc','Klassementsvoordeel gebruiken','De zwakkere kant start met het verschil in niveau als voorsprong. Dubbel: niveaus worden opgeteld. De voorsprong telt mee in de punten.')}
    ${num('hcMax','Maximum voorsprong','Leeg = geen maximum.','min="0"')}
  </div>
  <h3 style="margin-top:14px">Damescorrectie per klassement</h3>
  <p class="hint" style="margin-top:0">Per damesklassement vul je in hoeveel klassementen je erbij telt om op hetzelfde niveau als een heer te komen.
  Voorbeeld: staat er bij "Dame 6" een 2, dan speelt een dame met klassement 6 op het niveau van een heer 8.
  Wil je voor één speelster afwijken, vul dan bij die speler zelf het vakje "correctie" in (tabblad Spelers).</p>
  <div class="dc">${s.damesCorr.map((v,i)=>`<label>Dame ${i+1}<input type="number" step="0.5" data-dc="${i}" value="${esc(v)}" aria-label="Correctie dame klassement ${i+1}"><span>= heer ${fmt(i+1+(+v||0))}</span></label>`).join('')}</div></section>
  <section class="card"><h2>Gegevens</h2>
    <p class="hint" style="margin-top:0">Alles wordt automatisch bewaard in deze browser op dit toestel. Maak tussendoor een back-up als je wil wisselen van toestel.</p>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="export">Back-up kopiëren</button><button class="btn" data-act="import">Back-up laden (bestand)</button>
    <button class="btn danger" data-act="newT">Nieuw tornooi</button></div>
    ${confirmBox('newT')}
    <textarea id="backup" rows="3" style="width:100%;margin-top:10px;font:12px ui-monospace,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px" placeholder="Hier verschijnt de back-up (JSON). Je kan hier ook een back-up plakken en op Plakken laden drukken." aria-label="Back-up"></textarea>
    <div class="row"><button class="btn small" data-act="paste">Plakken laden</button></div>
    <p class="hint">Nieuw tornooi wist rondes en spelers van vandaag. De lijst gekende spelers (${Object.keys(DB).length}) blijft bewaard.</p></section>`;
}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const s=S.settings;
  $('#sub').textContent=`${s.mode==='team'?'Teamtornooi':'Individueel'} · ${activeP().length} spelers · ${s.courts} terreinen · tot ${s.target}`;
  $('#view').innerHTML=tab==='spelers'?vSpelers():tab==='rondes'?vRondes():tab==='klassement'?vKlass():vInst();
  save();
}

/* ---------- Acties ---------- */
function addPlayer(name,gender,rank,corr){
  const p={id:S.nextId++,name,gender,rank,corr,active:true,team:null,joined:firstFree()};markDirty();
  if(S.settings.mode==='team'&&S.teamsMade){p.team=null;S.players.push(p);p.team=autoTeam(p)}else S.players.push(p);
  DB[name.toLowerCase()]={name,gender,rank,corr};lsSet(DBKEY,DB);
}
function markDirty(){if(S.rounds.length>firstFree())S.dirty=true}
function busy(fn,done){toast('Planning wordt gemaakt…');setTimeout(()=>{fn();render();toast(done||'Planning klaar')},40)}
function syncDB(p){markDirty();DB[p.name.toLowerCase()]={name:p.name,gender:p.gender,rank:p.rank,corr:p.corr};lsSet(DBKEY,DB)}
document.addEventListener('submit',e=>{
  if(e.target.id!=='addForm')return;e.preventDefault();
  const name=$('#fName').value.trim();if(!name)return;
  if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){toast(name+' staat al in de lijst');return}
  addPlayer(name,$('#fG').value,+$('#fR').value,$('#fC').value.trim());
  render();toast(name+' toegevoegd');setTimeout(()=>$('#fName')?.focus(),0);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='fName'){const d=DB[t.value.trim().toLowerCase()];if(d){$('#fG').value=d.gender;$('#fR').value=d.rank;$('#fC').value=d.corr??''}}
  if(t.dataset.act==='score'){const m=S.rounds[+t.dataset.r].matches[+t.dataset.m];m[t.dataset.k]=t.value.replace(/[^0-9]/g,'');save()}
});
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act,p=t.dataset.id?P(+t.dataset.id):null;
  if(a==='g'){p.gender=t.value;syncDB(p)}
  else if(a==='r'){p.rank=+t.value;syncDB(p)}
  else if(a==='c'){p.corr=t.value.trim();syncDB(p)}
  else if(a==='act'){p.active=t.checked;markDirty();if(p.active&&S.settings.mode==='team'&&S.teamsMade&&!p.team)p.team=autoTeam(p)}
  else if(a==='score'){ // geen volledige herteken, zodat de cursor in het volgende vakje blijft
    const R=S.rounds[+t.dataset.r],m=R.matches[+t.dataset.m],card=t.closest('.match');
    card.classList.remove('ok','check','open');card.classList.add(scoreState(m,R.final));
    const n=R.matches.filter(scored).length,chip=t.closest('.card').querySelector('.chip');
    if(chip){chip.textContent=n===R.matches.length?'klaar':n+'/'+R.matches.length;chip.classList.toggle('ok',n===R.matches.length)}
    return}
  else if(t.dataset.set){const k=t.dataset.set;
    if(t.type==='checkbox')S.settings[k]=t.checked;
    else if(t.type==='number')S.settings[k]=t.value===''?(k==='hcMax'?'':DEF[k]):+t.value;
    else S.settings[k]=t.value;
    if(k==='minSingles'){S.rounds.slice(firstFree()).forEach(R=>{if(!R.final)R.minS=S.settings.minSingles});markDirty()}
    if(k==='courts')markDirty()}
  else if(t.dataset.dc!=null){S.settings.damesCorr[+t.dataset.dc]=t.value===''?0:+t.value}
  else if(t.id==='importFile'){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>loadBackup(rd.result);rd.readAsText(f);t.value='';return}
  else return;
  render();
});
function loadBackup(txt){
  try{const o=JSON.parse(txt);if(!o||!Array.isArray(o.players)||!Array.isArray(o.rounds))throw 0;
    S=o;S.settings={...DEF,...S.settings,hcFactor:1};render();toast('Back-up geladen')}
  catch(e){toast('Dit is geen geldige back-up')}
}
/* ---------- Klassement opzoeken via badman.app (publieke GraphQL-API) ---------- */
let BM=[];
async function badmanSearch(q){
  const parts=q.trim().split(/\s+/),like=v=>({$iLike:`%${v}%`});
  const where=parts.length===1?{$or:[{firstName:like(parts[0])},{lastName:like(parts[0])}]}
    :{$or:[{firstName:like(parts[0]),lastName:like(parts.slice(1).join(' '))},{firstName:like(parts.at(-1)),lastName:like(parts.slice(0,-1).join(' '))}]};
  const query='query Zoek($where: JSONObject){players(where:$where,take:12){rows{id fullName gender rankingLastPlaces{single double mix rankingDate}}}}';
  const r=await fetch('https://badman.app/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query,variables:{where}})});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();if(j.errors?.length)throw new Error(j.errors[0].message);
  return (j.data?.players?.rows||[]).map(p=>{const rp=(p.rankingLastPlaces||[])[0]||{};
    const best=Math.min(...[rp.single,rp.double,rp.mix].filter(x=>x>0),12);
    return {name:p.fullName,gender:p.gender==='F'?'D':'H',e:rp.single,d:rp.double,g:rp.mix,best}});
}
const DEMO=[['Lotte','D',5],['Jens','H',4],['Sara','D',8],['Pieter','H',6],['Emma','D',10],['Ruben','H',7],['Lien','D',7],['Tom','H',9],['Nina','D',11],['Wout','H',5],['Fien','D',9],['Arne','H',11],['Hanne','D',6],['Bram','H',8]];
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;lsSet(TABKEY,tab);pending=null;render();window.scrollTo(0,0);return}
  const a=b.dataset.act,p=b.dataset.id?P(+b.dataset.id):null;if(!a)return;
  const s=S.settings;
  switch(a){
    case 'bmSearch':{const q=$('#fName').value.trim(),box=$('#bmRes');
      if(q.length<2){toast('Typ eerst (een deel van) de naam');return}
      box.innerHTML='<p class="muted">Zoeken op badman.app…</p>';
      badmanSearch(q).then(rows=>{BM=rows;box.innerHTML=rows.length?rows.map((r,i)=>`<button type="button" class="bmrow" data-act="bmPick" data-i="${i}"><span>${esc(r.name)} <span class="muted">(${r.gender==='D'?'dame':'heer'})</span></span><span class="muted">E${r.e??'–'} D${r.d??'–'} G${r.g??'–'} → <b>${r.best}</b></span></button>`).join('')
        :'<p class="muted">Niemand gevonden op badman.app. Controleer de spelling of vul het klassement zelf in.</p>'})
      .catch(err=>{box.innerHTML=`<p class="warn">Badman.app kon niet bereikt worden (${esc(err.message)}).</p><p class="hint">Op claude.ai blokkeert de pagina verbindingen naar andere sites; in de app-versie werkt het wel, als je internet hebt. Vul het klassement anders zelf in.</p>`});
      return}
    case 'bmPick':{const r=BM[+b.dataset.i];if(!r)return;$('#fName').value=r.name;$('#fG').value=r.gender;$('#fR').value=r.best;$('#bmRes').innerHTML='';toast('Gegevens van '+r.name+' ingevuld');return}
    case 'del':S.players=S.players.filter(x=>x!==p);markDirty();break;
    case 'team':p.team=p.team==='A'?'B':'A';markDirty();break;
    case 'demo':DEMO.forEach(([n,g,r])=>addPlayer(n+' (vb)',g,r,''));break;
    case 'mkTeams':if(S.rounds.length){pending={act:'mkTeams',msg:'Er zijn al rondes gespeeld. Toch opnieuw verdelen?',run:makeTeams};break}makeTeams();toast('Teams gemaakt');break;
    case 'plan':{const ff=firstFree();busy(()=>planRounds(ff,Math.max(s.plannedRounds,ff)));return}
    case 'replan':{const fr=+b.dataset.from;busy(()=>planRounds(fr,Math.max(s.plannedRounds,S.rounds.length,fr)));return}
    case 'addRound':{const n=S.rounds.length;s.plannedRounds=Math.max(s.plannedRounds,n+1);busy(()=>planRounds(n,n+1),'Ronde '+(n+1)+' toegevoegd');return}
    case 'rms':case 'rps':case 'r11':case 'r22':{const i=+b.dataset.r,R=S.rounds[i],cur=R.minS??s.minSingles;
      R.minS=a==='rms'?Math.max(0,cur-1):a==='rps'?Math.min(+s.courts,cur+1):a==='r11'?+s.courts:0;
      busy(()=>planRounds(i,S.rounds.length));return}
    case 'dropFuture':pending={act:'dropFuture',msg:`De ${S.rounds.length-firstFree()} ongespeelde ronde(s) verwijderen?`,run:()=>{S.rounds.length=firstFree();S.dirty=false}};break;
    case 'final':if(S.rounds.length>firstFree()){pending={act:'final',msg:`Finaleronde maken? De ${S.rounds.length-firstFree()} ongespeelde ronde(s) worden verwijderd.`,run:generateFinal};break}
      generateFinal();toast('Finaleronde gemaakt');break;
    case 'delRound':pending={act:'delRound',msg:'Deze ronde met alle scores verwijderen?',run:()=>{S.rounds.pop();computeConflicts()}};break;
    case 'newT':pending={act:'newT',msg:'Alle spelers en rondes van dit tornooi wissen?',run:()=>{const st=S.settings;S=fresh();S.settings=st}};break;
    case 'yes':if(pending)pending.run();pending=null;break;
    case 'no':pending=null;break;
    case 'export':{const txt=JSON.stringify(S);$('#backup').value=txt;$('#backup').select();
      navigator.clipboard?.writeText(txt).then(()=>toast('Back-up gekopieerd'),()=>toast('Selecteer en kopieer de tekst'));return}
    case 'import':$('#importFile').click();return;
    case 'paste':loadBackup($('#backup').value);return;
    default:return;
  }
  render();
});
render();
</script>
